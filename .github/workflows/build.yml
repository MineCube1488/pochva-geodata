name: Build geoip.dat / geosite.dat

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

# Shared with publish-profile.yml: both push to the release branch
concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Clone v2fly/domain-list-community
        run: git clone --depth 1 https://github.com/v2fly/domain-list-community.git dlc

      - name: Build geosite.dat (category-ru + category-ads-all only)
        run: |
          cp geosite-profile.json dlc/profile.json
          mkdir -p output
          cd dlc
          go run ./ -datprofile=./profile.json -outputdir=../output

      - name: Clone v2fly/geoip
        run: git clone --depth 1 https://github.com/v2fly/geoip.git geoip

      - name: Get DB-IP Lite Country MMDB database
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          curl -L -o dbip.mmdb.gz "https://download.db-ip.com/free/dbip-country-lite-${YEAR}-${MONTH}.mmdb.gz"
          gzip -d dbip.mmdb.gz
          mkdir -p geoip/db-ip
          mv dbip.mmdb geoip/db-ip/dbip-country-lite.mmdb

      - name: Fetch Steam (AS32590) and Riot Games (AS6507) announced prefixes
        run: |
          curl -s "https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS32590" \
            | python3 -c "import json,sys; print('\n'.join(p['prefix'] for p in json.load(sys.stdin)['data']['prefixes']))" \
            > geoip/steam-ip.txt
          curl -s "https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS6507" \
            | python3 -c "import json,sys; print('\n'.join(p['prefix'] for p in json.load(sys.stdin)['data']['prefixes']))" \
            > geoip/riot-ip.txt
          wc -l geoip/steam-ip.txt geoip/riot-ip.txt

      - name: Build geoip.dat (ru + private + steam-ip + riot-ip)
        run: |
          cp geoip-config.json geoip/config-pochva.json
          cd geoip
          mkdir -p ../output
          go run ./ -c ./config-pochva.json

      # release is re-created from scratch below, so carry the published
      # routing profile over, and refuse to publish geo files that would
      # break it (e.g. a category removed upstream in v2fly)
      - name: Carry over published routing profile
        run: |
          git fetch --depth 1 origin release
          if git show origin/release:happ_routing_profile.json > output/happ_routing_profile.json 2>/dev/null; then
            echo "Профиль взят из текущего release"
          else
            echo "В release профиля ещё нет — берём из main"
            python3 scripts/profile_tool.py stamp happ_routing_profile.json --out output/happ_routing_profile.json
          fi

      - name: Check routing profile against freshly built geo files
        run: |
          python3 scripts/profile_tool.py check output/happ_routing_profile.json \
            --geosite output/geosite.dat --geoip output/geoip.dat

      - name: Generate sha256 checksums
        run: |
          cd output
          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum geoip.dat > geoip.dat.sha256sum
          ls -la

      - name: Publish to "release" branch
        run: |
          cd output
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin release
